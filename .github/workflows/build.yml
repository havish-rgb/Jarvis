
name: JARVIS Android APK Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JARVIS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract JARVIS ZIP
        run: |
          mkdir -p extracted
          unzip -q "Jarvis final.zip" -d extracted

      - name: Verify Android Project
        run: |
          cd extracted/jarvis-android
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          echo "JARVIS project found!"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd extracted/jarvis-android
          gradle assembleDebug

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: extracted/jarvis-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14


